spring.application.name=spedite-logistics
server.port=${PORT:8080}

# PostgreSQL values must be supplied by the deployment environment.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/logistics_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.error.include-message=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework

# Comma-separated browser origins. Same-origin Docker deployments do not rely on CORS,
# but these defaults keep local Angular development convenient.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
